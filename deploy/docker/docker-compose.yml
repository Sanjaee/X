services:
  proxy:
    image: nginx:alpine
    container_name: x-proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.api
    container_name: x-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      GOMEMLIMIT: 300MiB
      GOGC: 80
      DB_MAX_OPEN_CONNS: 20
      DB_MAX_IDLE_CONNS: 10
      MAX_CONCURRENT_REQUESTS: 300
      RATE_LIMIT_PER_MIN: 120
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:supersecretpassword30charslong123@postgres:5432/media_prod?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:supersecretredispass@redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      STORAGE_DIR: /app/data/uploads
      APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PLISIO_API_KEY: ${PLISIO_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-lostmedia}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
    volumes:
      - api_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M
    restart: unless-stopped

  web:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.web
    container_name: x-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost/api}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      PLISIO_API_KEY: ${PLISIO_API_KEY}
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: x-postgres
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c max_connections=80
      -c statement_timeout=3000ms
      -c idle_in_transaction_session_timeout=5000ms
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword30charslong123}
      POSTGRES_DB: ${DB_NAME:-media_prod}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../services/api/migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../../services/api/migrations/000002_subscriptions.up.sql:/docker-entrypoint-initdb.d/02_subscriptions.sql:ro
      - ../../services/api/migrations/000003_social_messaging_realtime.up.sql:/docker-entrypoint-initdb.d/03_social.sql:ro
      - ../../services/api/migrations/000004_recommendation_feed_ranking.up.sql:/docker-entrypoint-initdb.d/04_recommendations.sql:ro
      - ../../services/api/migrations/000005_search_indexing_and_history.up.sql:/docker-entrypoint-initdb.d/05_search.sql:ro
      - ../../services/api/migrations/000006_rbac_roles_memberships_quotas.up.sql:/docker-entrypoint-initdb.d/06_rbac.sql:ro
      - ../../services/api/migrations/000007_trending_and_user_recommendations.up.sql:/docker-entrypoint-initdb.d/07_trending.sql:ro
      - ../../services/api/migrations/000008_post_interactions_and_reposts.up.sql:/docker-entrypoint-initdb.d/08_interactions.sql:ro
      - ../../services/api/migrations/000009_outbox_resilience_and_dlq.up.sql:/docker-entrypoint-initdb.d/09_outbox_resilience.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: x-redis
    command: redis-server --requirepass supersecretredispass --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "supersecretredispass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 180M
        reservations:
          memory: 64M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: x-rabbitmq
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  api_uploads:
