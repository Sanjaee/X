services:
  proxy:
    image: nginx:alpine
    container_name: x-proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    restart: unless-stopped
    networks:
      - edge_net

  api:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.api
    container_name: x-api
    env_file:
      - ../../.env
    environment:
      PORT: 8080
      GOMEMLIMIT: 350MiB
      GOGC: 80
      DB_MAX_OPEN_CONNS: 20
      DB_MAX_IDLE_CONNS: 10
      MAX_CONCURRENT_REQUESTS: 300
      RATE_LIMIT_PER_MIN: 120
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      STORAGE_DIR: /app/data/uploads
      APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PLISIO_API_KEY: ${PLISIO_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-lostmedia}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}
    volumes:
      - api_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 450M
        reservations:
          memory: 96M
    restart: unless-stopped
    networks:
      - edge_net
      - data_net

  web:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.web
    container_name: x-web
    env_file:
      - ../../.env
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost/api/v1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      AUTH_URL: ${AUTH_URL:-http://localhost}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INTERNAL_API_URL: http://api:8080/api/v1
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - edge_net

  postgres:
    image: postgres:16-alpine
    container_name: x-postgres
    command: postgres -c shared_buffers=192MB -c work_mem=4MB -c max_connections=80 -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../services/api/migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../../services/api/migrations/000002_subscriptions.up.sql:/docker-entrypoint-initdb.d/02_subscriptions.sql:ro
      - ../../services/api/migrations/000003_social_messaging_realtime.up.sql:/docker-entrypoint-initdb.d/03_social.sql:ro
      - ../../services/api/migrations/000004_recommendation_feed_ranking.up.sql:/docker-entrypoint-initdb.d/04_recommendations.sql:ro
      - ../../services/api/migrations/000005_search_indexing_and_history.up.sql:/docker-entrypoint-initdb.d/05_search.sql:ro
      - ../../services/api/migrations/000006_rbac_roles_memberships_quotas.up.sql:/docker-entrypoint-initdb.d/06_rbac.sql:ro
      - ../../services/api/migrations/000007_trending_and_user_recommendations.up.sql:/docker-entrypoint-initdb.d/07_trending.sql:ro
      - ../../services/api/migrations/000008_post_interactions_and_reposts.up.sql:/docker-entrypoint-initdb.d/08_interactions.sql:ro
      - ../../services/api/migrations/000009_outbox_resilience_and_dlq.up.sql:/docker-entrypoint-initdb.d/09_outbox_resilience.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - data_net

  redis:
    image: redis:7-alpine
    container_name: x-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 96mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - data_net

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: x-rabbitmq
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 250M
        reservations:
          memory: 96M
    restart: unless-stopped
    networks:
      - data_net

volumes:
  postgres_data:
  api_uploads:

networks:
  edge_net:
    driver: bridge
  data_net:
    driver: bridge
