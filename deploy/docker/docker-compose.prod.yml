services:
  proxy:
    image: nginx:alpine
    container_name: x-proxy
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    restart: unless-stopped
    networks:
      - media_backend

  api:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.api
    container_name: x-api
    environment:
      PORT: 8080
      GOMEMLIMIT: 300MiB
      GOGC: 80
      DB_MAX_OPEN_CONNS: 20
      DB_MAX_IDLE_CONNS: 10
      MAX_CONCURRENT_REQUESTS: 300
      RATE_LIMIT_PER_MIN: 120
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:supersecretpassword30charslong123@postgres:5432/x_prod?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:supersecretredispass@redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      STORAGE_DIR: /app/data/uploads
      APP_URL: ${NEXT_PUBLIC_APP_URL:-https://lostmedia.pro}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PLISIO_API_KEY: ${PLISIO_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-lostmedia}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
    volumes:
      - x_api_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - media_backend

  web:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.web
    container_name: x-web
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-https://lostmedia.pro/api}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://lostmedia.pro}
      AUTH_URL: ${AUTH_URL:-https://lostmedia.pro}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      INTERNAL_API_URL: http://api:8080/api/v1
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - media_backend

  postgres:
    image: postgres:15-alpine
    container_name: x-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword30charslong123}
      POSTGRES_DB: ${DB_NAME:-x_prod}
    volumes:
      - x_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-x_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - media_backend

  redis:
    image: redis:7-alpine
    container_name: x-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-supersecretredispass} --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-supersecretredispass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 180M
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - media_backend

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: x-rabbitmq
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - media_backend

volumes:
  x_postgres_data:
  x_api_uploads:

networks:
  media_backend:
    external: true
