worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    types_hash_max_size 2048;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. Real IP Restoration from Cloudflare Edge & Docker Subnets (LM-SEC-005)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 2. Anti-DDoS Rate Limiting & Connection Limiting Zones per Client IP
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_status 429;

    # 3. Timeouts & Slowloris Buffer Protection
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    server_tokens off;

    # 4. Security Headers (X-Grade Defense-in-Depth)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://ssl.gstatic.com https://www.gstatic.com https://*.google.com; script-src-elem 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://ssl.gstatic.com https://www.gstatic.com https://*.google.com; connect-src 'self' http: https: ws: wss: https://accounts.google.com https://*.googleapis.com; img-src 'self' data: http: https: blob: https://*.googleusercontent.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://accounts.google.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com https://*.google.com;" always;

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream api_upstream {
        server api:8080;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # Main Server Block (HTTP 80 + HTTPS 443 TLS)
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name localhost lostmedia.pro www.lostmedia.pro tipchain.lostmedia.pro _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Enforce HTTPS when accessed via plaintext HTTP externally (LM-SEC-010)
        set $redirect_https 0;
        if ($scheme = "http") {
            set $redirect_https 1;
        }
        if ($http_x_forwarded_proto = "https") {
            set $redirect_https 0;
        }
        if ($host = "localhost") {
            set $redirect_https 0;
        }
        if ($host = "127.0.0.1") {
            set $redirect_https 0;
        }
        if ($request_uri ~ ^/health/) {
            set $redirect_https 0;
        }
        if ($redirect_https = 1) {
            return 301 https://$host$request_uri;
        }

        # WAF Rule 1: Block known vulnerability scanners & exploit bots
        if ($http_user_agent ~* (sqlmap|nikto|nuclei|nmap|masscan|dirbuster|gobuster|wpscan|acunetix|nessus|havij|zgrab)) {
            return 403;
        }

        # WAF Rule 2: Block SQL Injection / XSS / Path Traversal in URI & query strings
        if ($request_uri ~* "(\.\./|\.\.%2f|union.*select|select.*from|insert.*into|drop.*table|<script|%3cscript|javascript:|onerror=|onload=|information_schema|pg_sleep)") {
            return 403;
        }

        # Anti-DDoS Concurrent Connection Cap per IP
        limit_conn addr_conn 40;

        client_max_body_size 50M;
        proxy_hide_header X-Powered-By;

        # Embedded Docker DNS Resolver
        resolver 127.0.0.11 valid=5s ipv6=off;

        # Block direct external access to internal Google OAuth sync endpoint (LM-SEC-014)
        location = /api/v1/auth/google {
            return 403;
        }
        location = /api/auth/google-sync {
            return 403;
        }

        # Forward NextAuth requests to Next.js frontend
        location ^~ /api/auth/ {
            limit_req zone=auth_limit burst=15 nodelay;
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Strict rate limiting on Login & Register endpoints (LM-SEC-013)
        location ~ ^/api/(v1/)?auth/(login|register)$ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # WebSocket Realtime Gateway (Section 4G)
        location /api/v1/ws {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ws {
            rewrite ^/api/ws(.*)$ /api/v1/ws$1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Search rate limiting (expensive operations)
        location /api/v1/search {
            limit_req zone=search_limit burst=15 nodelay;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 5s;
        }

        # Forward general API requests to Go backend with burst protection
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        # Static uploads
        location /uploads/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
        }

        # Health & Observability endpoints (Unthrottled)
        location /health/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3s;
        }

        # Forward all other requests to Next.js Frontend
        location / {
            limit_req zone=general_limit burst=80 nodelay;
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
